<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 360px; padding: 15px; font-family: Arial; margin: 0; }
    h3 { margin-top: 0; color: #ff0000; text-align: center; }
    .khoi { background: #f5f5f5; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .khoi h4 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
    label { display: block; margin-top: 8px; margin-bottom: 3px; font-weight: bold; font-size: 12px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input.tu-dong { background: #f0fff4; border-color: #34d399; }
    button { width: 100%; padding: 11px; background: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 8px; }
    button:hover { background: #cc0000; }
    button.btn-xanh { background: #2563eb; }
    button.btn-xanh:hover { background: #1d4ed8; }
    button.btn-xam { background: #6b7280; font-size: 12px; padding: 8px; }
    .nho { font-size: 11px; color: #888; margin-top: 4px; }
    #kq { margin-top: 12px; padding: 12px; border-radius: 6px; min-height: 20px; display: none; white-space: pre-line; font-size: 13px; }
    .thanhcong { background: #f0fff4; color: green; }
    .loi { background: #fff0f0; color: red; }
    .thongbao-auto { font-size: 11px; padding: 6px 8px; border-radius: 4px; margin-top: 6px; display: none; }
    .auto-ok { background: #dcfce7; color: #166534; display: block; }
    .auto-sai { background: #fee2e2; color: #991b1b; display: block; }
    .dong-bo { display: flex; gap: 6px; align-items: center; }
    .dong-bo input { flex: 1; }
    .dong-bo button { width: auto; margin-top: 0; padding: 9px 10px; }
  </style>
</head>
<body>
  <h3>🎵 Lưu Khóa Theo Đoạn</h3>

  <div class="khoi">
    <h4>📋 Thông tin bài hát <span style="font-weight:normal;color:#16a34a;font-size:11px">(tự động điền)</span></h4>
    <label>Tên bài:</label>
    <div class="dong-bo">
      <input type="text" id="tenBai" placeholder="Tự lấy từ YouTube...">
      <button id="btnTuLay" class="btn-xanh" title="Lấy lại tên & thời lượng từ YouTube">🔄</button>
    </div>
    <label>Tổng thời lượng (giây):</label>
    <input type="number" id="tongThoiLuong" placeholder="Tự lấy từ YouTube...">
    <div class="thongbao-auto" id="thongBaoAuto"></div>
    <button id="btnLuuThongTin">💾 Lưu Thông Tin Bài</button>
    <div class="nho">Mở video YouTube → bật popup là 2 ô trên tự điền. Bạn vẫn có thể sửa tay.</div>
  </div>

  <div class="khoi">
    <h4>🎶 Thêm đoạn khóa</h4>
    <label>Bắt đầu (giây):</label>
    <input type="number" id="batDau" value="0">
    <label>Kết thúc (giây):</label>
    <input type="number" id="ketThuc" placeholder="VD: 185">
    <label>Khóa:</label>
    <input type="text" id="khoa" placeholder="VD: D, Eb, Am">
    <label>Chế độ:</label>
    <select id="cheDo">
      <option value="major">Trưởng (Major)</option>
      <option value="minor">Phụ (Minor)</option>
    </select>
    <button id="btnThemDoan">✅ Thêm Đoạn Này</button>
    <div class="nho">Sau khi lưu, ô Bắt đầu tự nhảy cho đoạn tiếp theo</div>
  </div>

  <div id="kq"></div>
  <script src="popup.js"></script>
</body>
</html>
