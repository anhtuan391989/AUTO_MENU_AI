<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Hiệu Ứng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        /* Cửa sổ riêng của Bảng Hiệu Ứng — cùng tông navy + viền cyan với menu chính */
        html, body { width: 100%; height: 100%; margin: 0; background: #010813; }
        body { display: flex; user-select: none; }
        .fx-box { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 14px 12px; border: 1px solid rgba(0,180,255,.45); background: linear-gradient(180deg,#03111f,#010813); }
        .fx-titlebar { display: flex; justify-content: space-between; align-items: center; height: 44px; flex: none; font-size: 15px; font-weight: bold; color: var(--cyan); -webkit-app-region: drag; cursor: move; }
        .fx-titlebar button { -webkit-app-region: no-drag; padding: 2px 8px; cursor: pointer; }
        .fx-toprow { display: flex; justify-content: space-between; align-items: center; flex: none; }
        .fx-aot { font-size: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--cyan); }
        .fx-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: none; }
        .fx-tabs button.active { box-shadow: 0 0 0 1px var(--cyan) inset; color: #00131f; text-shadow: none; }
        .fx-gridwrap { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; border: 1px solid rgba(0,180,255,.45); border-radius: 6px; background: rgba(0,180,255,.06); }
        .fx-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .fx-grid button { padding: 12px 4px; font-size: 12px; font-weight: bold; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fx-grid button:disabled { opacity: .35; cursor: not-allowed; }
        .fx-empty { grid-column: 1 / -1; font-size: 12px; color: #8fa5b8; text-align: center; padding: 16px 4px; }
        .fx-status { font-size: 10px; color: #ff6b6b; min-height: 12px; flex: none; }
    </style>
</head>

<body>
    <div class="fx-box">
        <div class="fx-titlebar">
            <span>✨ Bảng Hiệu Ứng</span>
            <button class="preset-btn" id="fxCloseBtn" title="Đóng (Esc)">✕</button>
        </div>
        <div class="fx-toprow">
            <label class="fx-aot">
                <input type="checkbox" id="fxAotCheck"> Luôn Hiện
            </label>
            <button class="preset-btn" id="fxEditBtn" title="Mở Cài đặt để thêm, đổi tên, thay file">EDIT</button>
        </div>
        <div class="fx-tabs">
            <button class="preset-btn active" id="fxTabHieuUng" data-group="HIEUUNG">HIỆU ỨNG</button>
            <button class="preset-btn" id="fxTabNhac" data-group="NHAC">NHẠC</button>
            <button class="preset-btn" id="fxStopBtn" title="Dừng mọi âm thanh đang phát">Dừng</button>
        </div>
        <div class="fx-gridwrap">
            <div class="fx-grid" id="fxGrid"></div>
        </div>
        <div class="fx-status" id="fxAotStatus"></div>
    </div>

    <script>
        (function () {
            const api = window.electronAPI;
            const closeBtn = document.getElementById("fxCloseBtn");
            const check = document.getElementById("fxAotCheck");
            const status = document.getElementById("fxAotStatus");
            const grid = document.getElementById("fxGrid");
            const tabs = Array.from(document.querySelectorAll(".fx-tabs [data-group]"));

            if (!api) { status.textContent = "Không kết nối được với ứng dụng."; return; }

            let items = [];
            let group = "HIEUUNG";
            // Nếu preload/main còn là bản cũ (chưa tắt hẳn ứng dụng sau khi chép file) thì báo rõ thay vì để bảng trống.
            const libReady = typeof api.getEffectsLibrary === "function" && typeof api.playLibEffect === "function";
            const emptyMsg = libReady ? "Chưa có hiệu ứng. Bấm EDIT để thêm." : "Ứng dụng chưa nạp bản mới. Hãy tắt hẳn AUTO MENU AI (kể cả dưới khay hệ thống) rồi mở lại.";

            // Vẽ lưới nút theo tab đang chọn. Tên nút dùng textContent (không chèn HTML).
            function render() {
                tabs.forEach((t) => t.classList.toggle("active", t.getAttribute("data-group") === group));
                grid.textContent = "";
                const shown = items.filter((it) => it.group === group);
                if (shown.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "fx-empty";
                    empty.textContent = emptyMsg;
                    grid.appendChild(empty);
                    return;
                }
                shown.forEach((it) => {
                    const b = document.createElement("button");
                    b.className = "preset-btn";
                    b.textContent = it.name;
                    b.title = it.name;
                    if (!it.exists) { b.disabled = true; b.title = it.name + " — không tìm thấy file âm thanh"; }
                    b.addEventListener("click", () => api.playLibEffect(it.id));
                    grid.appendChild(b);
                });
            }

            function setItems(list) { items = Array.isArray(list) ? list : []; render(); }

            tabs.forEach((t) => t.addEventListener("click", () => { group = t.getAttribute("data-group"); render(); }));
            if (libReady) {
                document.getElementById("fxStopBtn").addEventListener("click", () => api.stopLibEffects());
                document.getElementById("fxEditBtn").addEventListener("click", () => api.openEffectsEditor());
                api.getEffectsLibrary().then((r) => setItems(r && r.ok ? r.items : [])).catch(() => setItems([]));
                api.onEffectsLibChanged((list) => setItems(list));
            } else {
                render();
            }

            closeBtn.addEventListener("click", () => api.closeEffectsWindow());
            document.addEventListener("keydown", (e) => { if (e.key === "Escape") api.closeEffectsWindow(); });

            // Luôn hiển thị trạng thái THẬT do main trả về, không tự đoán.
            api.getEffectsAlwaysOnTop().then((r) => { check.checked = !!(r && r.value); }).catch(() => {});

            check.addEventListener("change", () => {
                status.textContent = "";
                api.setEffectsAlwaysOnTop(check.checked).then((r) => {
                    check.checked = !!(r && r.value);
                    if (!r || !r.ok) status.textContent = (r && r.error) || "Không áp dụng được.";
                }).catch(() => { check.checked = !check.checked; status.textContent = "Không áp dụng được."; });
            });
        })();
    </script>
</body>

</html>
